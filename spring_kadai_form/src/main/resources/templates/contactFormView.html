<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせフォーム</title>
    <style>
        body { font-family: sans-serif; }
        .wrap { width: 720px; margin: 20px auto; }
        .error { color: red; font-size: 14px; }
        .field { margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>お問い合わせフォーム</h1>
	<form th:action="@{/form}" th:object="${contactForm}" method="post">
	    <div class="field">
	        <label>お名前：</label><br>
	        <input type="text" th:field="*{name}">
	        <div class="error" th:errors="*{name}">エラー</div>
	    </div>

	    <div class="field">
	        <label>メールアドレス：</label><br>
	        <input type="text" th:field="*{email}">
	        <div class="error" th:errors="*{email}">エラー</div>
	    </div>

	    <div class="field">
	        <label>お問い合わせ内容：</label><br>
	        <textarea th:field="*{message}" rows="5" cols="40"></textarea>
	        <div class="error" th:errors="*{message}">エラー</div>
	    </div>

	    <button type="submit">確認</button>
	</form>
</div>
</body>
</html>
